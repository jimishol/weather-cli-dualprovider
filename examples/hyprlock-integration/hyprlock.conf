general {  
    hide_cursor = true  
}

# ── Background ──────────────────────────────
background {
    monitor =
    path = screenshot        # take a live screenshot
    blur_size = 3
    blur_passes = 3
    noise = 0.0117
    contrast = 1.2
    brightness = 0.65
    vibrancy = 0.2
}

# ── Password Input ──────────────────────────
input-field {
    monitor =
    size = 300, 60
    position = 0, 0
    halign = center
    valign = center
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255,255,255,0.2)
    inner_color = rgba(0,0,0,0.4)
    font_color  = rgba(255,255,255,1.0)
    rounding = 8
}

# ── Clock ───────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 72
    font_family = JetBrains Mono
    color = rgba(255,255,255,1.0)
    position = 0, -150
    halign = center
    valign = center
}

# ── Date ────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    font_size = 24
    font_family = JetBrains Mono
    color = rgba(200,200,200,1.0)
    position = 0, -80
    halign = center
    valign = center
}

# ── Weather ─────────────────────────────────
label {
    monitor =
    text = cmd[update:600000] ~/.config/waybar/scripts/weather/weather.sh | jq -r '.text'
    font_size = 20
    font_family = JetBrains Mono
    color = rgba(180,220,255,1.0)
    position = 0, 160
    halign = center
    valign = center
}

# ── Now Playing (mpv) ───────────────────────
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/mpv-title.sh
    font_size = 14
    font_family = JetBrains Mono
    color = rgba(255,255,255,0.9)
    position = 0, 40
    halign = center
    valign = center
}
